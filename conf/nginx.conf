location / {
  # Profilarr is public (main permission = visitors) and handles its own
  # authentication. SSOwat lets every request through to the app; the old
  # `auth_request off;` directive is a no-op on YunoHost 12's SSO and was removed.

  # Simple proxy to the Deno backend - it serves everything (frontend + API)
  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;
  proxy_http_version 1.1;
  proxy_buffering off;
}
