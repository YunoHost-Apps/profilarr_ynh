#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "profilarr"
name = "Profilarr"
description.en = "Configuration management tool for Radarr/Sonarr that automates importing and version control of custom formats and quality profiles."
description.fr = "Outil de gestion de configuration pour Radarr/Sonarr qui automatise l'importation des formats personnalisés et des profils de qualité."

version = "2.0.9~ynh1"

maintainers = ["bowgartfield"]

[upstream]
license = "AGPL-3.0-only"
website = "https://dictionarry.dev/"
#admindoc = "https://yunohost.org/packaging_apps"
#userdoc = "https://yunohost.org/apps"
code = "https://github.com/Dictionarry-Hub/profilarr"

fund = "https://github.com/sponsors/Dictionarry-Hub"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

# v2 is a Deno-compiled binary + SvelteKit frontend (was Python/React in v1).
# Build needs headroom for `deno install` (node_modules ~300M), the Deno
# toolchain itself (~200M), and `deno compile` output before cleanup.
# Runtime footprint after cleanup is the compiled binary (~320M) + data.
disk = "1.5G"
ram.build = "3G"
ram.runtime = "256M"

[install]
    [install.domain]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "domain"

    # No [install.path] question: upstream Profilarr v2 (SvelteKit) has no
    # configurable base path and has dozens of hardcoded absolute `/api/...`
    # fetch() calls client-side. It cannot be served from a sub-path without
    # forking upstream, so this app is installed at the root of a domain.

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "user"

[resources]
    [resources.sources.main]
    url = "https://github.com/Dictionarry-Hub/profilarr/archive/refs/tags/v2.0.9.tar.gz"
    sha256 = "2ff07ce99a5803b060a4c7db25110ff0883417b284fcd76e37a517b404ef486a"
    autoupdate.strategy = "latest_github_tag"

    [resources.sources.deno]
    # Build-time only toolchain to compile the app (deno install / vite build /
    # deno compile), removed again after the build. Pinned to match upstream's
    # Dockerfile builder image (denoland/deno:2.7.12) - bump this in lockstep
    # when upstream bumps their Dockerfile's Deno version.
    amd64.url = "https://github.com/denoland/deno/releases/download/v2.7.12/deno-x86_64-unknown-linux-gnu.zip"
    amd64.sha256 = "4646ec32b4296fdf963a62a3df3d57e342a3c70376976e5690c34d42e23a3080"
    arm64.url = "https://github.com/denoland/deno/releases/download/v2.7.12/deno-aarch64-unknown-linux-gnu.zip"
    arm64.sha256 = "4116c1bb5fa2bba348a1f89c5392d5ecdbb505dd7166796870660556ea6c6c53"
    in_subdir = false
    extract = true

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    [resources.ports]
    main.default = 6868

    [resources.apt]
    packages = "ca-certificates, curl, git, libsqlite3-0, tar, unzip"